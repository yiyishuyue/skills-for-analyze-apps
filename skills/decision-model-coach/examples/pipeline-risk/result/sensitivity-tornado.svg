<title>敏感性分析 · 真实工程案例：管道铺设施工风险应对</title>
<rect width="1240" height="298" fill="white"/>
<text x="36" y="40" font-size="20" font-weight="bold" fill="#1e293b">龙卷风图 · 对推荐方案「开展详细勘测」的单因素敏感性</text><text x="36" y="64" font-size="13" fill="#64748b">条越长 = 该变量在指定区间内变化时，当前数值领先方案 假设条件下的期望值 变化越大；竖虚线 = 基准 假设条件下的期望值</text><text x="36" y="154" font-size="13" fill="#1e293b">1. 每延期一月的机会损失</text><text x="36" y="172" font-size="11" fill="#64748b">摆幅 2.37 百万美元（16%）</text><rect x="300" y="142" width="800" height="20" rx="3" fill="#38bdf8"/><rect x="1100" y="142" width="2" height="20" rx="3" fill="#a78bfa"/><line x1="1100" y1="138" x2="1100" y2="166" stroke="#1e293b" stroke-width="2"/><text x="300" y="136" font-size="10.5" fill="#64748b">12.632</text><text x="1100" y="136" font-size="10.5" fill="#64748b">15.002</text><line x1="1100" y1="120" x2="1100" y2="186" stroke="#64748b" stroke-dasharray="4,4"/><text x="1104" y="202" font-size="11" fill="#64748b">基准 假设条件下的期望值 15.002 百万美元</text><text x="36" y="232" font-size="12.5" fill="#f97316">⚠ 结论翻转点：</text><text x="36" y="254" font-size="12" fill="#1e293b">· 每延期一月的机会损失 = 3.896 时推荐从「采用更优技术」变为「开展详细勘测」</text><text x="36" y="284" font-size="11" fill="#64748b">紫 = 高于基准段，蓝 = 低于基准段；数字由 decision_engine.py 逐一重算 假设条件下的期望值 得到</text></svg>